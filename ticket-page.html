<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Viewing Ticket</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Nunito+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--teal:#0b3b3c;--deep:#062728;--gold:#d4a84b;--red:#c0272d;--cream:#fbf3de}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:24px 14px;background:radial-gradient(circle at 50% 0,#12595a,var(--deep) 70%);font-family:'Nunito Sans',Arial,sans-serif;color:var(--cream)}
.t{visibility:hidden;position:relative;width:100%;max-width:380px;background:linear-gradient(#0b3b3c,#0a3132);border:2px solid var(--gold);border-radius:16px;text-align:center;overflow:hidden;box-shadow:0 20px 50px #0009}
.strip{height:12px;background:repeating-linear-gradient(90deg,var(--gold) 0 12px,var(--red) 12px 24px);border-bottom:2px solid var(--gold)}
.lan{position:absolute;top:12px;width:34px;height:68px;transform-origin:50% 0;animation:sw 4s ease-in-out infinite alternate}
.l1{left:26%}.l2{left:50%;margin-left:-17px;animation-delay:-1.5s}.l3{right:26%;animation-delay:-3s}
@keyframes sw{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
@media (prefers-reduced-motion:reduce){.lan{animation:none}}
.flo{position:absolute;width:86px;height:86px;top:22px}
.f1{left:-28px}.f2{right:-28px}
.top{padding:92px 20px 14px}
h1{font:700 38px/1 'Cormorant Garamond',Georgia,serif;color:var(--gold);margin:0 0 8px}
.top p{margin:2px 0;font-size:14px}
.who{margin:0 18px;padding:12px 6px 14px;border-top:1px dashed var(--gold);border-bottom:1px dashed var(--gold)}
.admit{display:flex;justify-content:center;align-items:center;gap:10px;color:var(--gold);font:600 24px 'Cormorant Garamond',Georgia,serif}
.fan{width:52px;height:35px}
.who b{display:block;font:700 38px/1.1 'Cormorant Garamond',Georgia,serif;margin:6px 0 4px}
.who .w{font-size:15px}
.when{padding:14px 20px 18px;font-size:14px;line-height:1.55}
.stub{position:relative;background:var(--cream);color:var(--deep);padding:24px 20px 16px;border-top:2px dashed var(--gold)}
.stub:before,.stub:after{content:"";position:absolute;top:-13px;width:24px;height:24px;border-radius:50%;background:#0a3132;border:2px solid var(--gold)}
.stub:before{left:-14px}.stub:after{right:-14px}
#qr{display:inline-block;padding:10px;background:#fff;border:3px solid var(--gold);border-radius:12px;line-height:0}
.tid{margin-top:12px;font-size:13px}
.tid b{display:block;font:700 24px 'Cormorant Garamond',Georgia,serif;letter-spacing:3px;color:var(--red)}
.note{font-size:12px;margin-top:6px;opacity:.8}
.foot{background:var(--deep);padding-top:12px;color:var(--gold);font:600 17px 'Cormorant Garamond',Georgia,serif}
.sky{display:block;width:100%;height:50px;margin-top:6px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="lan" viewBox="0 0 40 80"><path d="M20 0v14" stroke="#d4a84b" stroke-width="2"/><rect x="11" y="12" width="18" height="5" rx="2" fill="#d4a84b"/><ellipse cx="20" cy="34" rx="16" ry="19" fill="#c0272d"/><path d="M12 18q-8 16 0 32M20 15v38M28 18q8 16 0 32" stroke="#e8c26a" fill="none" opacity=".6"/><rect x="11" y="50" width="18" height="5" rx="2" fill="#d4a84b"/><path d="M16 55v14M20 55v18M24 55v14" stroke="#d4a84b" stroke-width="2"/></symbol>
<symbol id="flo" viewBox="-22 -22 44 44"><g fill="#ec5f86"><circle cy="-11" r="9"/><circle cy="-11" r="9" transform="rotate(72)"/><circle cy="-11" r="9" transform="rotate(144)"/><circle cy="-11" r="9" transform="rotate(216)"/><circle cy="-11" r="9" transform="rotate(288)"/></g><circle r="7" fill="#c0272d"/><circle r="3" fill="#d4a84b"/></symbol>
<symbol id="fan" viewBox="0 0 60 40"><path d="M30 38L3 15A34 34 0 0 1 57 15Z" fill="#d4a84b"/><path d="M30 38L14 9M30 38V4M30 38L46 9" stroke="#8a1c22" stroke-width="1.5"/><path d="M3 15A34 34 0 0 1 57 15" fill="none" stroke="#c0272d" stroke-width="3"/></symbol>
</defs></svg>
<div class="t">
  <div class="strip"></div>
  <svg class="lan l1"><use href="#lan"/></svg><svg class="lan l2"><use href="#lan"/></svg><svg class="lan l3"><use href="#lan"/></svg>
  <svg class="flo f1"><use href="#flo"/></svg><svg class="flo f2"><use href="#flo"/></svg>
  <div class="top">
    <h1><span data-f="title"></span></h1>
    <p><span data-f="theme"></span></p>
    <p><span data-f="batch"></span></p>
  </div>
  <div class="who">
    <div class="admit"><svg class="fan"><use href="#fan"/></svg>Admit one<svg class="fan"><use href="#fan"/></svg></div>
    <b><span data-f="name"></span></b>
    <span class="w">Watching <span data-f="student"></span> (<span data-f="section"></span>)</span>
  </div>
  <div class="when"><span data-f="date"></span><br><span data-f="time"></span><br><span data-f="venue"></span></div>
  <div class="stub">
    <div id="qr"></div>
    <div class="tid">Ticket ID<b data-f="id"></b></div>
    <div class="note">Show this at the entrance. One entry per ticket, so please don't share it.</div>
  </div>
  <div class="foot">Let’s make this a night to remember!
    <svg class="sky" viewBox="0 0 380 50" preserveAspectRatio="none"><g fill="#d4a84b"><circle cx="40" cy="12" r="1.3"/><circle cx="150" cy="8" r="1.3"/><circle cx="260" cy="14" r="1.3"/><circle cx="340" cy="9" r="1.3"/></g><path d="M0 50V34h24v-8h10v-8l8-8 8 8v8h10v8h22V30h16V20h8l10-12 10 12h8v10h20V26h14v8h20V28l12-14 12 14v6h18V22h12l10-10 10 10h10v12h16V30h22v20Z" fill="#0f4a4b"/><path d="M0 50V40h30v-6h12v6h30v-8h14v8h40V36h16v4h50V30h14v10h30v-8h12v8h60V38h20v12Z" fill="#0a3b3c"/></svg>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const API = 'https://script.google.com/macros/s/AKfycbzYEBQeyqBfpHv73dU2Q5J1LxO1U0KAWI8EtE4sl1kX_MDYmBZEwtQd9MCwxZ9njEId/exec';
const id = (new URLSearchParams(location.search).get('t') || '').toUpperCase();
const fail = m => { document.body.innerHTML = '<p style="padding:2em;text-align:center">' + m + '</p>'; };
fetch(API + '?action=ticket&t=' + encodeURIComponent(id)).then(r => r.json()).then(d => {
  if (d.status !== 'ok') return fail('Ticket not found. Please contact the organizers.');
  const v = Object.assign({}, d.ev, {name: d.name, student: d.student, section: d.section, id: d.id});
  document.querySelectorAll('[data-f]').forEach(e => { e.textContent = v[e.dataset.f]; });
  new QRCode(document.getElementById('qr'), {text: d.id, width: 180, height: 180, correctLevel: QRCode.CorrectLevel.H});
  document.querySelector('.t').style.visibility = 'visible';
}).catch(() => fail('Could not load your ticket. Check your connection and refresh.'));
</script>
</body>
</html>
